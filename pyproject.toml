[project]
name = "firstrun"
version = "0.1.0"
description = "A quickstart backed by actual setup attempts"
requires-python = ">=3.12,<3.13"
dependencies = ["anthropic", "streamlit", "rich"]

[project.scripts]
firstrun = "firstrun.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["firstrun*"]

[tool.ruff]
extend-exclude = ["firstrun/events.py", "fixtures"]

[tool.ruff.format]
exclude = ["PLAN.md"]
