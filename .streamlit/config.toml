[theme]
base = "dark"
primaryColor = "#8b5cf6"
backgroundColor = "#09090b"
secondaryBackgroundColor = "#131317"
textColor = "#f4f4f5"
borderColor = "#27272a"
showWidgetBorder = true
font = "Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
codeFont = "'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace"
codeBackgroundColor = "#0f0f13"
baseFontSize = 17
baseRadius = "12px"
greenColor = "#34d399"
redColor = "#fb7185"
yellowColor = "#fbbf24"
violetColor = "#8b5cf6"

[client]
toolbarMode = "minimal"
showSidebarNavigation = false

[browser]
gatherUsageStats = false
